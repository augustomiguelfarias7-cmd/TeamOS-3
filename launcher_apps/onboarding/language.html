<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeamOS 3.0 - Idioma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 48px 20px 32px;
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .lang {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lang:active, .lang.selected {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
    }
    .lang span { color: #64748b; font-size: 13px; }
    .btn-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, #0f172a 30%); }
    .btn {
      width: 100%; background: #3b82f6; color: white; border: none;
      padding: 16px; border-radius: 999px; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <h1>Selecione o idioma</h1>
  <p class="sub">Escolha o idioma do sistema</p>
  <div class="list" id="list">
    <div class="lang" data-lang="en-US">English (United States) <span>English</span></div>
    <div class="lang" data-lang="pt-BR">Português (Brasil) <span>Português</span></div>
    <div class="lang" data-lang="pt-PT">Português (Portugal) <span>Português</span></div>
    <div class="lang" data-lang="ja">日本語 <span>Japanese</span></div>
    <div class="lang" data-lang="en-GB">English (United Kingdom) <span>English</span></div>
    <div class="lang" data-lang="fr">Français <span>French</span></div>
    <div class="lang" data-lang="es">Español <span>Spanish</span></div>
    <div class="lang" data-lang="hi">हिन्दी <span>Hindi</span></div>
    <div class="lang" data-lang="ko">한국어 <span>Korean</span></div>
    <div class="lang" data-lang="en-AU">English (Australia) <span>English</span></div>
    <div class="lang" data-lang="ar">العربية <span>Arabic</span></div>
  </div>
  <div class="btn-area">
    <button class="btn" id="next" disabled onclick="location.href='wifi.html'">Continuar</button>
  </div>
  <script>
    const langs = document.querySelectorAll('.lang');
    const next = document.getElementById('next');
    langs.forEach(el => {
      el.addEventListener('click', () => {
        langs.forEach(l => l.classList.remove('selected'));
        el.classList.add('selected');
        next.disabled = false;
        localStorage.setItem('teamos_lang', el.dataset.lang);
      });
    });
  </script>
</body>
</html>
